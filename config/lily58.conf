# Battery report interval in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Fetch battery level from the right/peripheral half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Allow the central half to expose peripheral battery level to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y


# Keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5


# Increase BLE transmit power to improve latency / split communication
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keyboard Bluetooth name
CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# Workaround for Windows battery-reporting behavior
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n


# OLED
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Explicitly enable the useful built-in widgets
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_BONGO_CAT=n

# Leave WPM off initially
CONFIG_ZMK_WIDGET_WPM_STATUS=n


# Sleep / power management

# 10 minutes before idle
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# 15 minutes before deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n


# RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Turn RGB off when idle
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60


# Rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
